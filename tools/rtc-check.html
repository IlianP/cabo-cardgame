<!doctype html>
<meta charset="utf-8">
<title>WebRTC-Probe</title>
<pre id="out">bereit</pre>
<script type="module">
  import { CaboGame } from '/js/engine.js';
  import { mulberry32 } from '/js/deck.js';
  import { CaboHost } from '/js/host.js';
  import { CaboClient } from '/js/client.js';
  import { WebRtcHostTransport, WebRtcDeviceTransport } from '/js/webrtc.js';
  import { TABLE } from '/js/view.js';

  const role = new URLSearchParams(location.search).get('role');
  const log = (x) => (document.getElementById('out').textContent = JSON.stringify(x, null, 1));

  if (role === 'host') {
    const game = new CaboGame({
      players: [{ name: 'Anna' }, { name: 'Bea' }],
      rng: mulberry32(7),
    });
    const rtc = new WebRtcHostTransport();
    const host = new CaboHost(game, { transport: rtc });

    window.rtc = rtc;
    window.host = host;
    // Einladung erzeugen: genau das, was später im QR-Code steht.
    window.invite = () => rtc.invite();
    window.accept = (id, answer) => rtc.accept(id, answer);
    window.report = () => ({
      phase: game.state.phase,
      version: game.state.version,
      devices: [...host.devices.entries()].map(([id, i]) => [id, i.audience]),
      waitingFor: host.missingSeats(),
    });
  } else {
    const errors = [];
    let client = null;
    window.errors = errors;
    // Das Handy nimmt das Angebot an und liefert die Antwort zurück.
    window.answerInvite = async (offer) => {
      const rtc = new WebRtcDeviceTransport();
      window.dev = rtc;
      client = new CaboClient(rtc, { onError: (m) => errors.push(m) });
      window.client = client;
      const answer = await rtc.answer(offer);
      return answer;
    };
    window.waitOpen = () => window.dev.waitForOpen(15000).then(() => true);
    window.join = (seat) => client.join(seat === 'table' ? TABLE : seat);
    window.act = (action, ...args) => client.act(action, ...args);
    window.report = () => ({
      audience: client?.audience ?? null,
      version: client?.view?.version ?? null,
      phase: client?.view?.phase ?? null,
      can: client?.can ?? [],
      ids: JSON.stringify(client?.view ?? {}).match(/v\d+-\d+/g) ?? [],
      errors,
    });
  }
</script>
